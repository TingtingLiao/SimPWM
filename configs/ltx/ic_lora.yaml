# Template of the LTX-2.3 IC-LoRA training configs: proxy video(s) as reference + real first frame + caption -> real
# video. python -m simpwm.video.make_config fills in the model paths, the data root (latents from LTX-2's
# scripts/process_dataset.py), the output directory, the reference conditions and the validation samples.
model:
  model_path: "MODEL_PATH"
  text_encoder_path: "TEXT_ENCODER_PATH"
  training_mode: "lora"
  load_checkpoint: null
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"
training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
    conditions:
      - type: reference
        latents_dir: "reference_latents"
        probability: 1.0
      - type: first_frame       # the real first frame is always available at test time
        probability: 0.9
optimization:
  learning_rate: 2e-4
  steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: { }
  enable_gradient_checkpointing: true
acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: true
data:
  preprocessed_data_root: "DATA_ROOT"
  num_dataloader_workers: 2
validation:
  samples: VALIDATION_SAMPLES
  negative_prompt: >-
    blurry, out of focus, overexposed, underexposed, low contrast, washed out colors, excessive noise, flickering,
    motion blur, distorted proportions, extra limbs, inconsistent perspective, camera shake, cartoonish rendering,
    3D CGI look, unrealistic materials, jittery movement, unnatural transitions, AI artifacts.
  video_dims: [768, 448, 97]
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: 500
  video_cfg_scale: 3.0
  video_stg_scale: 1.0
  stg_blocks: [28]
  guidance_rescale: 0.7
  video_modality_guidance_scale: 1.0
  generate_audio: false
  generate_video: true
  skip_initial_validation: false
checkpoints:
  interval: 500
  keep_last_n: 3
  precision: "bfloat16"
flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: { }
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
output_dir: "OUTPUT_DIR"
seed: 42
